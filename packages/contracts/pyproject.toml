[project]
name = "oar-contracts"
version = "1.0.0"
description = "Shared typed contracts for OpenAMRobot AI Studio"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oar_contracts"]
