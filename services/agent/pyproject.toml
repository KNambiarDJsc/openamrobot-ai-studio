[project]
name = "studio-agent"
version = "0.1.0"
description = "Deterministic diagnostics copilot with optional Ollama / Strands phrasing"
requires-python = ">=3.11"
dependencies = ["oar-contracts", "httpx>=0.28,<0.29"]

[project.optional-dependencies]
strands = ["strands-agents[ollama]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["studio_agent"]
