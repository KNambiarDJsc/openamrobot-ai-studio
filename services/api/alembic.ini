[alembic]
script_location = migrations
# Overridden at runtime from DATABASE_URL (studio_api.store.init_db).
sqlalchemy.url = sqlite:///./data/studio.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
